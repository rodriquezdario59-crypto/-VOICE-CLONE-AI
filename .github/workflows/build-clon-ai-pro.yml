name: Build CLON AI PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-clon-ai-pro.yml"
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"

permissions:
  contents: read

jobs:
  build:
    name: Compile the actual CLON AI PRO project
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout CLON AI PRO
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the repository app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLON-AI-PRO-current-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
