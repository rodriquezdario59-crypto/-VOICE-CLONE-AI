name: Build CLON AI PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-clon-ai-pro.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout project workspace
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Download Qwen3 TTS Android source and native runtime
        run: |
          git clone --recurse-submodules https://github.com/Danmoreng/qwen3-tts-android.git android-source
          cd android-source
          git submodule update --init --recursive

      - name: Apply CLON AI PRO branding
        run: |
          sed -i 's/applicationId = "com.qwen.tts.android"/applicationId = "ai.clonaipro.app"/' android-source/app/build.gradle.kts
          sed -i 's/versionName = "0.1.0"/versionName = "1.0.0"/' android-source/app/build.gradle.kts
          sed -i 's/<string name="app_name">Qwen3 TTS<\//<string name="app_name">CLON AI PRO<\//' android-source/app/src/main/res/values/strings.xml

      - name: Build Android APK
        working-directory: android-source
        env:
          ANDROID_NDK_VERSION: "28.2.13676358"
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLON-AI-PRO-Android-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
